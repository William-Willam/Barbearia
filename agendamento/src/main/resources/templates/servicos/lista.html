<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Serviços</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
    <h1>Serviços</h1>
    <a th:href="@{/servicos/novo}" class="btn-novo">Novo Serviço</a>
    <table>
        <tr>
            <th>Nome</th>
            <th>Duração (min)</th>
            <th>Preço</th>
            <th>Ações</th>
        </tr>
        <tr th:each="servico : ${servicos}">
            <td th:text="${servico.nome}"></td>
            <td th:text="${servico.duracaoMinutos}"></td>
            <td th:text="${servico.preco}"></td>
            <td>
                <a th:href="@{/servicos/editar/{id}(id=${servico.id})}">Editar</a>
                <a th:href="@{/servicos/excluir/{id}(id=${servico.id})}"
                   onclick="return confirm('Excluir este serviço?')">Excluir</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
